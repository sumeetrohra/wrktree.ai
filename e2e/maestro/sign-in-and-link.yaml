appId: dev.agentdeck.app
---
# A development build with EXPO_PUBLIC_DEV_AUTH=1. LINK_CODE comes from `agentdeck login --print`.
- launchApp:
    clearState: true
- assertVisible: "Dev user id"
- tapOn: "Relay"
- eraseText
- inputText: ${RELAY_URL}
- tapOn: "me"
- inputText: "me"
- tapOn: "Dev sign-in"
- extendedWaitUntil:
    visible: "Work"
    timeout: 60000
- tapOn: "Computers"
- tapOn: "Link a computer"
- tapOn: "ABCD-EFGH"
- inputText: ${LINK_CODE}
- tapOn: "Approve"
- extendedWaitUntil:
    visible: "is joining your account"
    timeout: 30000

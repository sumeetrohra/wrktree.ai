appId: dev.agentdeck.app
---
- launchApp:
    clearState: true
- assertVisible: "Pair with your computer"
- tapOn: "agentdeck://pair?o=…"
- inputText: ${PAIR_LINK}
- tapOn: "Continue"
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- tapOn: "Email me a code"
- tapOn: "123456"
- inputText: ${CODE}
- tapOn: "Sign in and pair"
- assertVisible:
    id: "short-code"
- extendedWaitUntil:
    visible: "Repositories"
    timeout: 60000

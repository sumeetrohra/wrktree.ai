# Cloudflare Worker + Durable Objects build of the relay. See docs/relay-deploy.md.
name = "agentdeck-relay"
main = "dist/main.worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DirectoryDO", "HubDO"]

# Local development and the contract tests: dev ID-token issuer, recorded pushes.
[env.dev]
vars = { RELAY_DEV = "1", RELAY_PUBLIC_URL = "http://127.0.0.1:8787", RELAY_DEV_SECRET = "dev-only-secret-dev-only-secret-dev-only" }

[[env.dev.durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[env.dev.durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

# Staging. FIREBASE_PROJECT_ID is a plain var; EXPO_ACCESS_TOKEN is set with
# `wrangler secret put --env staging`, never committed.
[env.staging]
vars = { RELAY_DEV = "0", RELAY_PUBLIC_URL = "https://relay-staging.agentdeck.dev", FIREBASE_PROJECT_ID = "agentdeck-staging" }

[[env.staging.durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[env.staging.durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

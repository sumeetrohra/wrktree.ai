name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end tests
        run: pnpm --filter @agentdeck/e2e test
        env:
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@agentdeck.dev
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@agentdeck.dev
      - name: npm packages install and run (agentdeck --help, daemon starts, relay, protocol)
        run: pnpm release smoke

  checks:
    name: knip, audit, app web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high
      - run: pnpm build
      - name: App web export
        run: pnpm --filter @agentdeck/mobile export:web
      - name: App store config resolves (icons, permissions, plugins)
        run: pnpm --filter @agentdeck/mobile exec expo config --type public --json > /dev/null
      - name: Site builds and every internal link resolves
        run: pnpm --filter @agentdeck/site build

  relay:
    name: relay (Worker + self-host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Contract tests on both hosts (wrangler dev + Node)
        run: pnpm --filter @agentdeck/relay test
        env:
          RELAY_WORKER_TESTS: "1"
      - name: Self-host Docker image builds
        run: docker build -f apps/relay/Dockerfile -t agentdeck-relay:ci .

  app-e2e:
    name: app E2E (web build in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentdeck/e2e exec playwright-core install --with-deps chromium
      - run: pnpm build
      - name: App web export with dev sign-in (the relay's dev issuer stands in for Firebase)
        run: pnpm --filter @agentdeck/mobile export:web
      - name: App scenarios (sign in, link, two computers, task, offline, push deep link, removal, desktop web)
        run: pnpm --filter @agentdeck/e2e exec vitest run src/app.test.ts
        env:
          APP_E2E: "1"
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@agentdeck.dev
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@agentdeck.dev

  cloud:
    name: cloud history (Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentdeck/e2e exec playwright-core install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @agentdeck/mobile export:web
      - name: Firebase REST client and security rules against the emulators
        run: pnpm emulators "pnpm --filter @agentdeck/firebase-rest test"
      - name: Cloud history scenarios (host syncs, phone reads with the host off, app reads it)
        run: pnpm emulators "pnpm --filter @agentdeck/e2e exec vitest run src/cloud.test.ts src/cloud-app.test.ts"
        env:
          CLOUD_E2E: "1"
          APP_E2E: "1"
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@agentdeck.dev
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@agentdeck.dev

  record:
    name: record E2E video
    runs-on: ubuntu-latest
    needs: [test, app-e2e, cloud]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @agentdeck/e2e exec playwright-core install --with-deps chromium
      - name: Record every scenario, cloud history included (under the Firebase emulators)
        run: pnpm emulators "pnpm e2e:record"
        env:
          CLOUD_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-video
          path: |
            artifacts/e2e.mp4
            artifacts/e2e-results.json
            artifacts/app-e2e.mp4
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end tests
        run: pnpm --filter @agentdeck/e2e test
        env:
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@agentdeck.dev
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@agentdeck.dev

  checks:
    name: knip, audit, app web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high
      - run: pnpm build
      - name: App web export
        run: pnpm --filter @agentdeck/mobile export:web

  record:
    name: record E2E video
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pnpm --filter @agentdeck/e2e exec playwright-core install --with-deps chromium
      - run: pnpm e2e:record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-e2e-video
          path: |
            artifacts/phase-1-e2e.mp4
            artifacts/phase-1-e2e-results.json
          if-no-files-found: warn

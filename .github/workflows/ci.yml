name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end tests
        run: pnpm --filter @agentdeck/e2e test
        env:
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@agentdeck.dev
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@agentdeck.dev

  checks:
    name: knip, audit, app web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high
      - run: pnpm build
      - name: App web export
        run: pnpm --filter @agentdeck/mobile export:web

  relay:
    name: relay (Worker + self-host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Contract tests on both hosts (wrangler dev + Node)
        run: pnpm --filter @agentdeck/relay test
        env:
          RELAY_WORKER_TESTS: "1"
      - name: Self-host Docker image builds
        run: docker build -f apps/relay/Dockerfile -t agentdeck-relay:ci .

  app-e2e:
    name: app E2E (web build in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentdeck/e2e exec playwright-core install --with-deps chromium
      - run: pnpm build
      - name: App web export with dev sign-in (the relay's dev issuer stands in for Firebase)
        run: pnpm --filter @agentdeck/mobile export:web:e2e
      - name: App scenarios (sign in, link, two computers, task, offline, push deep link, removal, desktop web)
        run: pnpm --filter @agentdeck/e2e exec vitest run src/app.test.ts
        env:
          APP_E2E: "1"
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@agentdeck.dev
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@agentdeck.dev

  record:
    name: record E2E video
    runs-on: ubuntu-latest
    needs: [test, app-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pnpm --filter @agentdeck/e2e exec playwright-core install --with-deps chromium
      - run: pnpm e2e:record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-video
          path: |
            artifacts/e2e.mp4
            artifacts/e2e-results.json
            artifacts/app-e2e.mp4
          if-no-files-found: warn

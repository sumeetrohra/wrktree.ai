name: Site

on:
  push:
    branches: [main]
    paths: [apps/site/**, docs/**, apps/mobile/assets/**]

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  # Deploys wait until the repository has these secrets (Settings → Secrets → Actions).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.repository == 'sumeetrohra/wrktree.ai'
    steps:
      - name: Skip until a CLOUDFLARE_API_TOKEN secret exists
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "No CLOUDFLARE_API_TOKEN secret yet; nothing to deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: pnpm --filter @agentdeck/site build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: pnpm --filter @agentdeck/site run deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
